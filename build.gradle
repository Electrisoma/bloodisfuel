processResources {
    //noinspection GroovyAccessibility
    def buildProps=project.properties.clone()

    // Replaces FML's magic file.jarVersion string with the correct version at build time.
    buildProps.put('file', [jarVersion: project.version])

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand buildProps as Map<String, ?>
    }
}

compileJava {
    options.compilerArgs=['-Xdiags:verbose']
}

jar {
    from('LICENSE') {
        rename { "${it}_${archivesBaseName}" }
    }

    manifest.attributes([
            "MixinConfigs": "bloodisfuel.mixins.json",
            "Git-Hash"    : gitHash
    ])
}

tasks.named("sourcesJar") {
    manifest.attributes([
            "Git-Hash": gitHash
    ])
}

final slimJar=tasks.register("slimJar", Jar) {
    archiveClassifier="slim"
    from(sourceSets.main.output)
    from(refmap)

    manifest.attributes([
            "MixinConfigs": "bloodisfuel.mixins.json",
            "Git-Hash"    : gitHash
    ])
}
obfuscation.reobfuscate(slimJar, sourceSets.main)

project.publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java

            artifact(tasks.jar) {
                classifier="all"
            }
        }
    }

    repositories {
        maven {
            name="GitHubPackages"
            url=uri("https://maven.pkg.github.com/electrisoma/ElectrisomaMaven")
            credentials {
                username=localProperties.getProperty("mavenUsername", "")
                password=localProperties.getProperty("mavenToken", "")
            }
        }
    }
}

